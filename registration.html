<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <div class="registration-page-wrapper">
        <nav class="registration-page-tabs">
          <button type="button" class="registration-page-tab">Login</button>
          <span>|</span>
          <button type="button" class="registration-page-tab active">
            Register
          </button>
        </nav>
        <p>Enter your email and password to register.</p>
        <form class="registration-form">
          <input type="text" placeholder="Username" required />
          <input type="email" placeholder="Enter your email address" required />
          <div class="password-field-icon">
            <input type="password" placeholder="Password" required />
            <button
              type="button"
              class="toggle-password"
              aria-label="Show password"
            >
              <svg class="eye-icon" width="18" height="16" aria-hidden="true">
                <use href="images/sprite.svg#eye-icon"></use>
              </svg>
            </button>
          </div>
          <input type="password" placeholder="Confirm Password" required />
          <button type="submit" class="registration-form-btn">Register</button>
        </form>
        <div class="separation-line">
          <span>Or register with</span>
        </div>
        <div class="social-media-registration">
          <a href="https://www.google.com" class="social-media-link google">
            <svg class="google-icon" width="20" height="20">
              <use href="images/sprite.svg#google-icon"></use>
            </svg>
            Continue with Google
          </a>
          <a href="https://www.facebook.com" class="social-media-link facebook">
            <img src="images/facebook-icon.png" alt="Facebook icon" />
            Continue with Facebook
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
